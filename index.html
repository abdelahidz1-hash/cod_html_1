<!DOCTYPE html>

  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الأكواد المطور | Phantom Editor</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-color: #000000; 
            --card-bg: #111111;
            --accent-color: #000000; 
            --text-color: #f1f5f9;
            --border-color: #222222;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            font-weight: 300;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0px;
        }

        .all-controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: #0a0a0a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .button-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 600px;
            background-color: var(--card-bg);
            color: var(--text-color); 
            border: 1px solid var(--border-color); 
            padding: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 300;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            resize: vertical;
        }

        #preview-window {
            display: none;
            width: 100%;
            height: 600px;
            background-color: #ffffff; 
            border-radius: 10px;
            border: 2px solid var(--border-color);
            box-sizing: border-box;
        }

        #back-btn {
            display: none;
            background-color: transparent;
            border: none;
            cursor: pointer;
        }

        #back-btn img {
            width: 30px;
            height: 30px;
            filter: invert(1);
        }

        button {
            background-color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-weight: 300;
        }

        button:hover {
            background-color: #222;
        }

        button img {
            width: 20px;
            height: 20px;
            filter: invert(1); 
        }

        .notification-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        #red-dot {
            display: none;
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            background-color: red;
            border-radius: 50%;
            pointer-events: none;
        }

        #history-modal, #github-modal, #notifications-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            z-index: 1001;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        #filename-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .history-item, .notification-item {
            background: #0a0a0a;
            border-bottom: 1px solid #1a1a1a;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            font-family: 'Cairo', sans-serif;
            font-weight: 300;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
            margin-bottom: 15px;
            font-family: 'Cairo', sans-serif;
            font-weight: 300;
            box-sizing: border-box;
        }

        .history-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .close-history-btn {
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
        }

        .close-history-btn img {
            width: 35px;
            height: 35px;
            filter: invert(1);
        }

        #upload-btn-text {
            font-family: 'Cairo', sans-serif;
            font-weight: 300;
            width: 100%;
            background: #222;
            padding: 12px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="overlay" onclick="closeModals()"></div>

    <div id="notifications-modal">
        <div class="history-header">
            <button onclick="closeModals()" class="close-history-btn">
                <img src="https://images.icon-icons.com/3162/PNG/96/left_return_arrow_icon_193335.png" alt="إغلاق">
            </button>
        </div>
        <div id="notifications-list"></div>
    </div>

    <div id="filename-modal">
        <h3 style="margin-top: 0; font-size: 16px;">أدخل اسم الملف</h3>
        <input type="text" id="zip-filename" class="input-field" placeholder="مثال: my_project">
        <div style="display:flex; gap:10px;">
            <button onclick="confirmDownload()" style="background: #1a1a1a; flex:1;" title="تحميل">
                <img src="https://images.icon-icons.com/1875/PNG/96/download_120262.png" alt="تحميل">
            </button>
            <button onclick="closeModals()" style="background: #000; flex:1;" title="إلغاء">
                <img src="https://images.icon-icons.com/1769/PNG/96/4115230-cancel-close-cross-delete_114048.png" alt="إلغاء">
            </button>
        </div>
    </div>

    <div id="github-modal">
        <div class="history-header">
            <button onclick="closeModals()" class="close-history-btn">
                <img src="https://images.icon-icons.com/3162/PNG/96/left_return_arrow_icon_193335.png" alt="إغلاق">
            </button>
        </div>
        <p style="font-size: 13px; color: #888;">ألصق الكود هنا للمعاينة والرفع:</p>
        <textarea id="github-code-input" oninput="previewGithubCode()" placeholder="ألصق الكود هنا..." style="height: 150px; margin-bottom: 10px;"></textarea>
        <div style="font-size: 12px; color: #666; margin-bottom: 5px;">المعاينة التلقائية:</div>
        <iframe id="github-preview" style="width:100%; height:200px; background:#fff; border-radius:5px; margin-bottom:10px; border:none;"></iframe>
        <button id="upload-btn-text" onclick="uploadToGithub()">
            رفع ونشر الموقع الآن
        </button>
        <div id="github-link-display" style="margin-top:15px; padding:10px; background:#111; border:1px solid #333; display:none; word-break:break-all;"></div>
    </div>

    <div id="history-modal">
        <div class="history-header">
            <button onclick="closeModals()" class="close-history-btn">
                <img src="https://images.icon-icons.com/3162/PNG/96/left_return_arrow_icon_193335.png" alt="إغلاق">
            </button>
        </div>
        <div id="history-list"></div>
    </div>

    <div class="container">
        <div class="top-header">
            <div class="label" id="editor-label" style="font-size: 14px; color: #666;"></div>
            <button id="back-btn" onclick="toggleEditor()" title="الرجوع للمحرر">
                <img src="https://images.icon-icons.com/3162/PNG/96/left_return_arrow_icon_193335.png" alt="رجوع">
            </button>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button onclick="openGithubUI()" title="نشر" style="border: none; background: transparent;">
                    <img src="https://images.icon-icons.com/3261/PNG/96/github_logo_icon_206752.png" alt="Github" style="width: 20px; height: 20px; filter: invert(1);">
                </button>
                
                <div class="notification-container">
                    <button onclick="openNotifications()" title="إشعارات" style="border: none; background: transparent;">
                        <img src="https://images.icon-icons.com/3449/PNG/96/attention_notice_bell_alarm_reminder_alert_notification_icon_219315.png" alt="إشعارات" style="width: 20px; height: 20px;">
                    </button>
                    <div id="red-dot"></div>
                </div>

                <button onclick="openHistory()" title="سجلات" style="border: none; background: transparent;">
                    <img src="https://images.icon-icons.com/508/PNG/96/settings_icon-icons.com_49858.png" alt="سجلات" style="width: 20px; height: 20px;">
                </button>
            </div>
        </div>

        <div class="all-controls-wrapper" id="main-controls-wrapper">
            <div class="button-group">
                <button onclick="copyCode()" title="نسخ"><img src="https://images.icon-icons.com/3476/PNG/96/internet_browser_essential_basic_website_web_paste_copy_ui_icon_219913.png"></button>
                <button onclick="pasteCode()" title="لصق"><img src="https://images.icon-icons.com/2783/PNG/96/content_paste_copy_clipboard_icon_177307.png"></button>
                <button onclick="clearCode()" title="مسح"><img src="https://images.icon-icons.com/868/PNG/96/trash_bin_icon-icons.com_67981.png"></button>
            </div>
            <div class="button-group">
                <button onclick="showFilenameInput()" title="تحميل ZIP"><img src="https://images.icon-icons.com/4043/PNG/96/file_direction_down_save_download_icon_256878.png"></button>
                <button onclick="saveCode()" title="حفظ"><img src="https://images.icon-icons.com/4026/PNG/96/save_icon_255899.png"></button>
                <button onclick="runCode()" style="background: #1a1a1a;" title="تشغيل"><img src="https://images.icon-icons.com/3259/PNG/96/play_playback_icon_206354.png"></button>
            </div>
        </div>

        <textarea id="code-input" placeholder="اكتب الكود هنا..."></textarea>
        <iframe id="preview-window"></iframe>
    </div>

    <script>
        const GITHUB_API_TOKEN = "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"; 
        const GITHUB_REPO = "abdelahidz1-hash/cod_html_2027";

        window.onload = checkNotifications;

        function checkNotifications() {
            const notes = JSON.parse(localStorage.getItem('web_notifications') || "[]");
            document.getElementById('red-dot').style.display = notes.length > 0 ? 'block' : 'none';
        }

        function closeModals() {
            document.getElementById('history-modal').style.display = 'none';
            document.getElementById('github-modal').style.display = 'none';
            document.getElementById('notifications-modal').style.display = 'none';
            document.getElementById('filename-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        async function uploadToGithub() {
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3');
            audio.volume = 1.0; 
            audio.play();

            const content = document.getElementById('github-code-input').value;
            const linkDiv = document.getElementById('github-link-display');
            if (!content.trim()) return;

            linkDiv.style.display = "block";
            linkDiv.innerHTML = "جاري الاتصال بـ GitHub...";

            try {
                let sha = "";
                const getRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/index.html`, {
                    headers: { "Authorization": `token ${GITHUB_API_TOKEN}` }
                });
                if (getRes.ok) sha = (await getRes.json()).sha;

                const upRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/index.html`, {
                    method: "PUT",
                    headers: { "Authorization": `token ${GITHUB_API_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        message: "تحديث من محرر فانتوم", 
                        content: btoa(unescape(encodeURIComponent(content))), 
                        sha: sha 
                    })
                });

                if (upRes.ok) {
                    const siteUrl = `https://${GITHUB_REPO.split('/')[0]}.github.io/${GITHUB_REPO.split('/')[1]}/`;
                    linkDiv.innerHTML = `تم الرفع! سيصلك إشعار بعد دقيقة.`;
                    
                    setTimeout(() => {
                        addNotification(siteUrl);
                        checkNotifications();
                        alert("تم إضافة الإشعار في قائمة التنبيهات!");
                    }, 60000); 
                } else {
                    linkDiv.innerHTML = "خطأ: تأكد من التوكن.";
                }
            } catch (e) { linkDiv.innerHTML = "فشل الرفع."; }
        }

        function addNotification(url) {
            // تشغيل صوت الإشعار
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3');
            audio.play();

            let notes = JSON.parse(localStorage.getItem('web_notifications') || "[]");
            notes.unshift({ 
                url: url, 
                date: new Date().toLocaleString('ar-EG'), 
                msg: "مرحبا بكم في COD HTML هذا موقعك الذي تم رفعه" 
            });
            localStorage.setItem('web_notifications', JSON.stringify(notes.slice(0, 10)));
        }

        function openNotifications() {
            const list = document.getElementById('notifications-list');
            const notes = JSON.parse(localStorage.getItem('web_notifications') || "[]");
            list.innerHTML = notes.length ? '' : '<p style="text-align:center; color:#666">لا توجد إشعارات حالياً</p>';
            notes.forEach((n, index) => {
                const div = document.createElement('div');
                div.className = 'notification-item';
                div.innerHTML = `
                    <div style="flex:1">
                        <div style="font-weight:700">${n.msg}</div>
                        <div style="font-size:11px; color:#3498db; word-break:break-all">${n.url}</div>
                        <div style="font-size:10px; color:#555">${n.date}</div>
                    </div>
                    <button onclick="window.open('${n.url}', '_blank')">فتح</button>
                    <button onclick="deleteNote(${index})" style="background:transparent; color:red; border:none; font-size:20px">×</button>
                `;
                list.appendChild(div);
            });
            document.getElementById('notifications-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function deleteNote(index) {
            let notes = JSON.parse(localStorage.getItem('web_notifications') || "[]");
            notes.splice(index, 1);
            localStorage.setItem('web_notifications', JSON.stringify(notes));
            checkNotifications();
            openNotifications();
        }

        function copyCode() { document.getElementById('code-input').select(); document.execCommand('copy'); alert('تم النسخ!'); }
        async function pasteCode() { const text = await navigator.clipboard.readText(); document.getElementById('code-input').value += text; }
        function clearCode() { if(confirm('هل تريد المسح؟')) document.getElementById('code-input').value = ''; }
        function previewGithubCode() { const code = document.getElementById('github-code-input').value; const preview = document.getElementById('github-preview'); const doc = preview.contentDocument || preview.contentWindow.document; doc.open(); doc.write(code); doc.close(); }
        function openGithubUI() { document.getElementById('github-modal').style.display = 'block'; document.getElementById('overlay').style.display = 'block'; document.getElementById('github-code-input').value = document.getElementById('code-input').value; previewGithubCode(); }
        function runCode() { const code = document.getElementById('code-input').value; const previewFrame = document.getElementById('preview-window'); const previewDoc = previewFrame.contentDocument || previewFrame.contentWindow.document; previewDoc.open(); previewDoc.write(code); previewDoc.close(); document.getElementById('code-input').style.display = 'none'; document.getElementById('main-controls-wrapper').style.display = 'none'; previewFrame.style.display = 'block'; document.getElementById('back-btn').style.display = 'flex'; }
        function toggleEditor() { document.getElementById('code-input').style.display = 'block'; document.getElementById('main-controls-wrapper').style.display = 'flex'; document.getElementById('preview-window').style.display = 'none'; document.getElementById('back-btn').style.display = 'none'; }
        function showFilenameInput() { document.getElementById('filename-modal').style.display = 'block'; document.getElementById('overlay').style.display = 'block'; }
        function confirmDownload() { const code = document.getElementById('code-input').value; const filename = document.getElementById('zip-filename').value.trim() || "project"; const zip = new JSZip(); zip.file("index.html", code); zip.generateAsync({type: "blob"}).then(function(content) { const link = document.createElement('a'); link.href = URL.createObjectURL(content); link.download = filename + ".zip"; link.click(); closeModals(); }); }
        function saveCode() { const code = document.getElementById('code-input').value; let history = JSON.parse(localStorage.getItem('codeHistory') || "[]"); history.unshift({ date: new Date().toLocaleString('ar-EG'), content: code }); localStorage.setItem('codeHistory', JSON.stringify(history.slice(0, 15))); alert('تم الحفظ!'); }
        function openHistory() { const list = document.getElementById('history-list'); const history = JSON.parse(localStorage.getItem('codeHistory') || "[]"); list.innerHTML = history.length ? '' : '<p style="text-align:center">السجل فارغ</p>'; history.forEach((item, index) => { const div = document.createElement('div'); div.className = 'history-item'; div.innerHTML = `<div style="flex:1">نسخة #${history.length - index}<div style="font-size:10px">${item.date}</div></div><button onclick="loadFromHistory(${index})">استعادة</button><button onclick="deleteHistory(${index})" style="color:red;background:transparent;border:none">×</button>`; list.appendChild(div); }); document.getElementById('history-modal').style.display = 'block'; document.getElementById('overlay').style.display = 'block'; }
        function loadFromHistory(index) { document.getElementById('code-input').value = JSON.parse(localStorage.getItem('codeHistory'))[index].content; closeModals(); }
        function deleteHistory(index) { let history = JSON.parse(localStorage.getItem('codeHistory')); history.splice(index, 1); localStorage.setItem('codeHistory', JSON.stringify(history)); openHistory(); }
    </script>
</body>
</html>
    
  </body>
  
</html>
